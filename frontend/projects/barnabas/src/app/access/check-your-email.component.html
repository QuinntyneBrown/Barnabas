<div class="container">
  <div class="state stack-5">
    <svg viewBox="0 0 120 96" role="img" aria-label="A posted note" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="10" y="18" width="100" height="66" />
      <path d="m10 18 50 38 50-38" />
    </svg>

    <h1>Check your email</h1>

    <p>
      A sign-in link is on its way to <strong>{{ address() }}</strong>. It works once and expires
      in fifteen minutes.
    </p>

    <div class="btn-group">
      <button class="btn btn-secondary" type="button" (click)="sendAgain()">Send it again</button>
      <a class="btn btn-ghost" routerLink="/sign-in">Use a different address</a>
    </div>
  </div>
</div>
