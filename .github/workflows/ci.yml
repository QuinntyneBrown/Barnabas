name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch supersedes the first; a run on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

  # The suites run against a real SQL Server, because that is the only thing that can express the
  # row versions, filtered unique indexes and conditional updates the concurrency criteria turn on.
  # See docs/adr/backend/0001-use-sql-server-for-persistence.md.
  SA_PASSWORD: "Barnabas-CI-${{ github.run_id }}!"

jobs:
  backend:
    name: Backend — build and acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Barnabas-CI-${{ github.run_id }}!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore
        working-directory: backend

      # TreatWarningsAsErrors is on, so this is the first gate rather than a formality.
      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"
        working-directory: backend
        env:
          BARNABAS_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True"

  frontend:
    name: Frontend — build and browser acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Barnabas-CI-${{ github.run_id }}!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v5

      # Playwright drives the real product: the Angular application, the API behind a proxy, and a
      # real database. Both runtimes are needed.
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the client
        run: npm run build
        working-directory: frontend

      - name: Install browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The config starts the API and the dev server itself, so nothing here needs to.
      - name: Acceptance tests
        run: npx playwright test
        working-directory: frontend
        env:
          BARNABAS_E2E_SQL: "Server=localhost,1433;Database=Barnabas_E2E;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
