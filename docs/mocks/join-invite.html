<!DOCTYPE html>
<!--
  Invite-code entry page for new St. Aidan's members.
  Responsive notes:
  - <768px: single centered form column.
  - >=768px: no material layout change, just more surrounding whitespace around the same max-440px column.
  - >=1280px: no material layout change, only wider page margins.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter invite code · Barnabas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="landing.html"><span class="brand-mark" aria-hidden="true">B</span> Barnabas</a>
    </div>
  </header>

  <main id="main" class="page-main">
    <div class="container">
      <div class="auth-shell">
        <section class="card panel stack">
          <a class="back-link" href="landing.html">← Back</a>
          <div class="stack">
            <h1>Enter your invite code</h1>
            <p class="text-muted">Your code may have come from a Sunday bulletin, a parish email, or directly from Fr. Michael Chen or another St. Aidan's leader.</p>
          </div>

          <form action="create-profile.html" method="get">
            <div class="field">
              <label for="invite-code">Invite code</label>
              <input id="invite-code" name="invite-code" type="text" value="AIDAN7" maxlength="6" autocapitalize="characters" spellcheck="false" required>
              <p class="field-hint">Codes are usually six characters long.</p>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Continue</button>
          </form>

          <p class="text-sm text-muted mb-0">Already set up? <a href="sign-in.html">Sign in instead</a>.</p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
