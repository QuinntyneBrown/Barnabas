<!DOCTYPE html>
<!--
A profile helps fellow parishioners know who they are meeting. Submitting it
  now leads to the waiting state rather than straight to the board, because a
  moderator approves new members first.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your profile · Barnabas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="landing.html">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1.4" y="1.4" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <rect x="9.6" y="9.6" width="15" height="15" fill="currentColor"/>
      </svg>
      Barnabas
    </a>
  </div>
</header>

<main id="main" class="page-main">

  <div class="container">
    <div class="auth stack-6">
      <a class="back-link" href="join-invite.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-6 7 6 7"/></svg>
      Back
    </a>
      <div class="stack-2">
        <h1>Tell the parish who you are</h1>
        <p class="lede">A simple profile helps fellow members know who they are meeting.</p>
      </div>

      <form class="stack-6" action="join-pending-approval.html" method="get">

        <div class="field">
          <span class="field-label">Photo</span>
          <div class="upload-tile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5h3.5L8 6h8l1.5 2.5H21v11H3z"/><circle cx="12" cy="14" r="3.6"/></svg>
            <span>Add a photo</span>
          </div>
          <p class="field-hint">Optional, and easy to add later.</p>
        </div>

        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="Lillian Osei">
        </div>

        <div class="field">
          <label for="hood">Neighbourhood</label>
          <select id="hood" name="hood">
            <option value="">Choose your neighbourhood</option>
        <option>Riverdale</option>
        <option>Leslieville</option>
        <option>The Danforth</option>
        <option>Scarborough</option>
        <option>The Beaches</option>
        <option>East York</option>
        <option>Cabbagetown</option>
        <option>North York</option>
          </select>
        </div>

        <div class="field">
          <label for="bio">A line about you</label>
          <textarea id="bio" name="bio" rows="3" placeholder="Optional"></textarea>
        </div>

        <div class="field">
          <span class="field-label">What are you glad to help with?</span>
          <p class="field-hint">Optional, and changeable at any time.</p>
          <div class="check-grid">
          <label class="choice">
            <input type="checkbox" name="help" value="Tutoring">
            <span><span class="choice__title">Tutoring</span></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="help" value="Rides">
            <span><span class="choice__title">Rides</span></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="help" value="Moving help">
            <span><span class="choice__title">Moving help</span></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="help" value="Tech support">
            <span><span class="choice__title">Tech support</span></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="help" value="Meal trains">
            <span><span class="choice__title">Meal trains</span></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="help" value="Hospital visits">
            <span><span class="choice__title">Hospital visits</span></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="help" value="Minor repairs">
            <span><span class="choice__title">Minor repairs</span></span>
          </label>
          <label class="choice">
            <input type="checkbox" name="help" value="Childminding">
            <span><span class="choice__title">Childminding</span></span>
          </label>
          </div>
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit">Ask to join</button>
      </form>
    </div>
  </div>
</main>

</body>
</html>
