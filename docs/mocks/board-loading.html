<!-- Demonstrates the board loading state with skeleton cards. Responsive change: below 768px the cards stack in one column with the bottom tab bar; at 768px+ the header nav replaces it and the skeleton grid expands to two columns, then three at 1280px. -->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Loading · Barnabas</title>
<link rel="stylesheet" href="styles.css">
</head>

    <a class="brand" href="board.html"><span class="brand-mark" aria-hidden="true">B</span> Barnabas</a>

      <a href="board.html" aria-current="page">Board</a>

            <div class="skeleton" style="height: 14px; width: 38%;"></div>

          <div class="listing-card-footer">
