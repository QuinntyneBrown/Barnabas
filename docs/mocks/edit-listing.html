<!DOCTYPE html>
<!--
Editing an existing listing. Distinct from the create form in its heading, its
  action, and the archive option it carries — the original set reused the create
  form, which still read "Step 2 of 2 / Post listing" while editing.
-->

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit listing · Barnabas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="board.html">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1.4" y="1.4" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <rect x="9.6" y="9.6" width="15" height="15" fill="currentColor"/>
      </svg>
      Barnabas
    </a>
    <nav class="primary-nav" aria-label="Primary">
      <a href="board.html">Board</a>
      <a href="search.html">Search</a>

      <a href="inbox-requests-incoming.html">Inbox</a>
      <a href="you.html">You</a>
    </nav>
    <div class="header-actions">
      <a class="bell" href="notifications.html" aria-label="Notifications, 4 new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.2 5.5 2 6.5H4c.8-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <span class="bell-count" aria-hidden="true">4</span>
      </a>
    </div>
  </div>
</header>

<main id="main" class="page-main">

  <div class="masthead masthead--stone masthead--short">
    <div class="container">
      <h1 class="masthead-title">Edit listing</h1>
    </div>
  </div>

  <div class="container section-tight">
    <a class="back-link" href="my-listings-active.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-6 7 6 7"/></svg>
      My listings
    </a>

    <form class="form stack-7" action="my-listings-active.html" method="get">

      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="DeWalt cordless drill, two batteries">
      </div>

      <div class="field">
        <label for="cat">Category</label>
        <select id="cat" name="cat"><option selected>Tools</option><option>Household</option><option>Electronics</option></select>
      </div>

      <div class="field">
        <label for="desc">Description</label>
        <textarea id="desc" name="desc" rows="5">Bought it for one job and it has sat in the cupboard since. Both batteries still hold a charge.</textarea>
      </div>

      <div class="form-grid">
        <div class="field">
          <label for="price">Asking price</label>
          <div class="input-prefix"><span>$</span><input type="number" id="price" name="price" value="45"></div>
        </div>
        <div class="field">
          <label for="hood">Neighbourhood</label>
      <select id="hood" name="hood">
        <option selected>Riverdale</option>
        <option>Leslieville</option>
        <option>The Danforth</option>
        <option>Scarborough</option>
        <option>The Beaches</option>
        <option>East York</option>
        <option>Cabbagetown</option>
        <option>North York</option>
      </select>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary btn-lg" type="submit">Save changes</button>
        <a class="btn btn-ghost btn-lg" href="my-listings-active.html">Cancel</a>
        <button class="btn btn-danger btn-lg" type="button" data-open-dialog="archive">Archive</button>
      </div>

    </form>
  </div>
</main>

<dialog id="archive" aria-labelledby="archive-title">
  <h2 id="archive-title">Archive this listing?</h2>
  <p>It comes off the board. You can restore it later from your archived listings.</p>
  <div class="btn-group">
    <a class="btn btn-primary" href="my-listings-archived.html">Archive</a>
    <button class="btn btn-ghost" type="button" data-close-dialog>Cancel</button>
  </div>
</dialog>

    Search
  </a>
  <a href="new-listing-choose-type.html" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Post

  <a href="inbox-requests-incoming.html">

    Inbox

  <a href="you.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"/></svg>
    You

</body>
</html>
