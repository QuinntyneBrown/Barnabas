<!DOCTYPE html>
<!--
Sign-in is passwordless: a single-use link goes to the member's email address.
  That removes password storage, reset flows, and a memory burden from the
  oldest members of a congregation whose help tags include tech support.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Barnabas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="landing.html">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1.4" y="1.4" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <rect x="9.6" y="9.6" width="15" height="15" fill="currentColor"/>
      </svg>
      Barnabas
    </a>
  </div>
</header>

<main id="main" class="page-main">

  <div class="container">
    <div class="auth stack-6">
      <div class="stack-2">
        <h1>Sign in to St.&nbsp;Aidan's</h1>
        <p class="lede">No password. Barnabas emails a link that signs you in.</p>
      </div>

      <form class="stack-5" action="check-your-email.html" method="get">
        <div class="field">
          <label for="email">Your email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <p class="field-hint">Use the address the parish office has for you.</p>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Email me a sign-in link</button>
      </form>

      <hr>

      <p>New to the board? <a class="link" href="join-invite.html">Join with an invite code</a>.</p>
    </div>
  </div>
</main>

</body>
</html>
