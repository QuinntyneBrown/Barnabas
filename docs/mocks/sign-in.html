<!DOCTYPE html>
<!--
  Sign-in page for existing St. Aidan's members.
  Responsive notes:
  - <768px: single centered form column.
  - >=768px: no material layout change, just more surrounding whitespace around the same max-440px column.
  - >=1280px: no material layout change, only wider page margins.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Barnabas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="landing.html"><span class="brand-mark" aria-hidden="true">B</span> Barnabas</a>
    </div>
  </header>

  <main id="main" class="page-main">
    <div class="container">
      <div class="auth-shell">
        <section class="card panel stack">
          <a class="back-link" href="landing.html">← Back</a>
          <div class="stack">
            <h1>Sign in to St. Aidan's Barnabas board</h1>
            <p class="text-muted">Use the email address you gave the parish office or the one you used when you first joined Barnabas.</p>
          </div>

          <form action="board.html" method="get">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@staidans.example" required>
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
            </div>

            <div class="auth-actions">
              <button class="btn btn-primary btn-block" type="submit">Sign in</button>
              <a class="btn btn-secondary btn-block" href="board.html">Send me a sign-in link</a>
            </div>
          </form>

          <p class="text-sm text-muted mb-0">Don't have an account yet? <a href="join-invite.html">Enter your invite code</a>.</p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
