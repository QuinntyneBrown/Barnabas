<!DOCTYPE html>
<!--
The Search destination's real home. The original set had no search entry at
  all — the Search nav item landed on a pre-run query for "ladder", and the only
  real search form was buried inside the no-results page.

  Responsive: the filter fields stack under 768px and sit two-up above.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search · Barnabas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="board.html">
      <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1.4" y="1.4" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <rect x="9.6" y="9.6" width="15" height="15" fill="currentColor"/>
      </svg>
      Barnabas
    </a>
    <nav class="primary-nav" aria-label="Primary">
      <a href="board.html">Board</a>
      <a href="search.html" aria-current="page">Search</a>
      <a class="nav-post" href="new-listing-choose-type.html">Post</a>
      <a href="inbox-requests-incoming.html">Inbox</a>
      <a href="you.html">You</a>
    </nav>
    <div class="header-actions">
      <a class="bell" href="notifications.html" aria-label="Notifications, 4 new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.2 5.5 2 6.5H4c.8-1 2-2.5 2-6.5Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
        <span class="bell-count" aria-hidden="true">4</span>
      </a>
    </div>
  </div>
</header>

<main id="main" class="page-main">

  <div class="masthead masthead--stone masthead--short">
    <div class="container">
      <h1 class="masthead-title">Search the board</h1>
    </div>
  </div>

  <div class="container section-tight">
    <form class="form stack-7" action="search-results.html" method="get">

      <div class="field">
        <label for="q">What are you looking for?</label>
        <input type="search" id="q" name="q" placeholder="A ladder, a crib, a ride&hellip;">
      </div>

      <div class="field">
        <span class="field-label">Kind of listing</span>
        <p class="field-hint">Leave all unticked to search everything.</p>
      <div class="check-grid">
        <label class="choice">
          <input type="checkbox" name="kind" value="lend">
          <span><span class="choice__title">Lend</span></span>
        </label>
        <label class="choice">
          <input type="checkbox" name="kind" value="give">
          <span><span class="choice__title">Give</span></span>
        </label>
        <label class="choice">
          <input type="checkbox" name="kind" value="sell">
          <span><span class="choice__title">Sell</span></span>
        </label>
        <label class="choice">
          <input type="checkbox" name="kind" value="help">
          <span><span class="choice__title">Help</span></span>
        </label>
      </div>
      </div>

      <div class="field">
        <label for="hood">Neighbourhood</label>
      <select id="hood" name="hood">
        <option value="">Choose your neighbourhood</option>
        <option>Riverdale</option>
        <option>Leslieville</option>
        <option>The Danforth</option>
        <option>Scarborough</option>
        <option>The Beaches</option>
        <option>East York</option>
        <option>Cabbagetown</option>
        <option>North York</option>
      </select>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary btn-lg" type="submit">Search</button>
        <a class="btn btn-ghost btn-lg" href="board.html">Browse the whole board</a>
      </div>

    </form>
  </div>

  <div class="container section">
    <div class="stack-5">
      <h2>Asked for recently</h2>
      <div class="rows">
        <a class="list-row" href="search-results.html">
          <div class="list-row__body"><span class="list-row__title">Ladder</span></div>
        </a>
        <a class="list-row" href="search-results.html">
          <div class="list-row__body"><span class="list-row__title">Crib</span></div>
        </a>
        <a class="list-row" href="search-results.html">
          <div class="list-row__body"><span class="list-row__title">Rides to appointments</span></div>
        </a>
      </div>
    </div>
  </div>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a href="board.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h8v6H3zM13 5h8v4h-8zM3 15h8v4H3zM13 13h8v6h-8z"/></svg>
    Board
  </a>
  <a href="search.html" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg>
    Search
  </a>
  <a href="new-listing-choose-type.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    Post
  </a>
  <a href="inbox-requests-incoming.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h5l1.6 3h4.8L16 12h5"/><path d="M4.6 5.5h14.8L21 12v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-6z"/></svg>
    Inbox
  </a>
  <a href="you.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c.9-3.8 3.9-6 7.5-6s6.6 2.2 7.5 6"/></svg>
    You
  </a>
</nav>

</body>
</html>
